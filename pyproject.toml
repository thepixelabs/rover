[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rover-tui"
version = "0.4.0"
description = "SSH-friendly TUI session manager and AI agent launcher for your Mac"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["tui", "terminal", "ai", "agents", "claude"]
classifiers = [
    "Environment :: Console",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0",
    "pyfiglet>=1.0.1",
    "rich-pyfiglet>=0.2.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://rover.pixelabs.net"
Repository = "https://github.com/thepixelabs/rover"
Changelog = "https://github.com/thepixelabs/rover/blob/main/CHANGELOG.md"

[project.scripts]
rover = "rover.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]


[tool.hatch.build.targets.wheel]
packages = ["src/rover"]

[tool.hatch.build.targets.sdist]
exclude = [
    "landing/",
    "docs/",
    ".github/",
    "tests/",
    "uv.lock",
    ".mcp.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/rover/__init__.py:__version__"]
branch = "main"
build_command = "pip install build && python -m build"
commit_parser = "angular"
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
major_tags = ["landmark"]
patch_tags = ["fix", "perf", "refactor", "revert"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^style",
    "^test",
    "^build",
    "^ci",
    "^chore",
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_pypi = false
upload_to_release = true

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"
